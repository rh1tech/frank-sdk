# FRANK Next: frank-test's run-time descriptor. Imported from frank-test
# core/board_table.c; edit here, gen_boards.py writes the C table.
order: 9
id: FRANK_BOARD_NEXT
name: FRANK Next
slug: next
mcu: rp2350b
role: master
target: NX
caps:
- CAP_PSRAM_QMI
- CAP_SD
- CAP_SD_4BIT
- CAP_VIDEO_HDMI
- CAP_AUDIO_I2S
- CAP_AUDIO_CODEC_I2C
- CAP_USB_DEVICE
- CAP_USB_HOST
- CAP_USB_HUB
- CAP_USB_MUX
- CAP_TAPE_IN
- CAP_RTC_DS3231
- CAP_I2C
- CAP_ESP01
- CAP_LINK
- CAP_LINK_RUN
pico_socket: false
module_memory: false
pins:
  uart_tx: 46
  uart_rx: 45
  sd_dat0: 4
  sd_cs: 7
  sd_clk: 1
  sd_cmd: 0
  sd_dat1: 5
  sd_dat2: 6
  i2s_data: 11
  i2s_clk_base: 9
  i2s_mclk: 8
  video_base: 12
  psram_cs: 47
  esp_uart_tx: 46
  esp_uart_rx: 45
  tape_in: 44
  i2c_sda: 2
  i2c_scl: 3
  link_a_data: 20
  link_b_data: 30
