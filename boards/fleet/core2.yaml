name: FRANK Core 2
slug: core2
mcu: rp2350b
role: master
target: C2
caps:
- CAP_PSRAM_QMI
- CAP_SD
- CAP_VIDEO_HDMI
- CAP_AUDIO_I2S
- CAP_USB_DEVICE
- CAP_USB_HOST
- CAP_USB_HUB
- CAP_USB_MUX
- CAP_TAPE_IN
- CAP_LINK
