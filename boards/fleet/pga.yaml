# FRANK PGA: frank-test's run-time descriptor. Imported from frank-test
# core/board_table.c; edit here, gen_boards.py writes the C table.
order: 1
id: FRANK_BOARD_FRANK_PGA
name: FRANK PGA
slug: pga
mcu: rp2350b
role: single
target: M2
target_differences:
    psram_cs: the PGA2350 module carries the PSRAM (module_memory) on GP47
    pwm_l: frank-test sets pwm_* only on boards with no I2S at all; here PWM reaches the same
      I2S pins through the audio mux, which is what boards/m2.yaml audio.pwm records
    pwm_r: as pwm_l
caps:
- CAP_SD
- CAP_VIDEO_HDMI
- CAP_VIDEO_VGA
- CAP_VIDEO_COMPOSITE
- CAP_AUDIO_I2S
- CAP_AUDIO_AMP
- CAP_AUDIO_MUX
- CAP_USB_DEVICE
- CAP_USB_HOST
- CAP_USB_HUB
- CAP_USB_MUX
- CAP_PS2
- CAP_GAMEPAD_NES
- CAP_TAPE_IN
- CAP_ESP01
- CAP_LED_PLAIN
- CAP_I2C
- CAP_RTC_DS3231
pico_socket: false
module_memory: true
pins:
  uart_tx: 0
  uart_rx: 1
  ps2_kb_clk: 2
  ps2_kb_dat: 3
  ps2_ms_clk: 0
  ps2_ms_dat: 1
  sd_dat0: 4
  sd_cs: 5
  sd_clk: 6
  sd_cmd: 7
  i2s_data: 9
  i2s_clk_base: 10
  video_base: 12
  led_plain: 25
  esp_uart_tx: 38
  esp_uart_rx: 39
  pad_latch: 21
  pad_clk: 20
  pad_d1: 26
  pad_d2: 27
  tape_in: 22
  i2c_sda: 28
  i2c_scl: 29
video_default: auto
i2s_lr_swapped: false
signature_name: sig_frank_pga
signature:
  0: high
  1: high
  2: high
  3: high
  23: dontcare
  24: dontcare
  28: high
  29: high
  30: float
  47: high
flash_bytes: 0
psram_bytes: 0
manual_note: S1 selects the USB mux; JP1 selects the audio mux and the PAM8403 shutdown. Neither is reachable
  from firmware.
inline_notes:
- |-
  A Pimoroni PGA2350, which brings its own flash and 8 MB of PSRAM
  on GP47. Not pico_socket: a PGA2350 exposes all 48 GPIOs.
signature_inline_notes:
- TXS0104 A-side, 10K
- |-
  Bare pads, and the only thing left that separates this board from
  oldskoolfrank — which brings its ESP-01S strapping pins back here
  through 1K. Everything above is now identical on the two: see
  sig_oldskoolfrank for why GP0-3 stopped being a discriminator.
- |-
  2026-11-27, against the current frank_pga (frank-lab; frank_pga_4layer
  has the same nets), on hardware. GP23/24 now reach the ESP-01 socket's
  GPIO2/GPIO0 through 1K, and a fitted module pulls them high: don't
  care. GP28/29 were "float, no I2C"; a DS3231MZ (U14) sits there now
  with 4.7K pull-ups, and they read high. With both wrong, and the
  DS3231 answering on a board that declared none, detection called a
  FRANK PGA MegaFRANK. High, not don't care: it is what keeps a PGA apart
  from OldSkoolFRANK (GP28 floats there) now that GP23/24 cannot; a PGA
  without the RTC still wins at 8/10 against OldSkoolFRANK's 7/9. GP30
  (MegaFRANK's 1-Wire, pulled up there) keeps it apart from MegaFRANK.
- no 1-Wire
- |-
  The PGA2350's own PSRAM chip select, pulled up inside the module.
  This said FLOAT on the reasoning that the carrier fits no PSRAM,
  which is true and is not what the pin reads: a Pimoroni PGA2350
  brings 8 MB on GP47 exactly as a Pico Plus 2 does. Measured high
  on hardware.
