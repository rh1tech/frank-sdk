# miniFRANK: frank-test's run-time descriptor. Imported from frank-test
# core/board_table.c; edit here, gen_boards.py writes the C table.
order: 4
id: FRANK_BOARD_MINIFRANK
name: miniFRANK
slug: mini
mcu: rp2350a
role: single
target: M2
target_differences:
    pwm_l: frank-test sets pwm_* only on boards with no I2S at all; here PWM reaches the same
      I2S pins through the audio mux, which is what boards/m2.yaml audio.pwm records
    pwm_r: as pwm_l
caps:
- CAP_PSRAM_QMI
- CAP_SD
- CAP_VIDEO_HDMI
- CAP_VIDEO_VGA
- CAP_AUDIO_I2S
- CAP_AUDIO_MUX
- CAP_USB_DEVICE
- CAP_USB_HOST
- CAP_USB_HUB
- CAP_USB_MUX
- CAP_PS2
- CAP_GAMEPAD_NES
- CAP_TAPE_IN
- CAP_TAPE_DIP_GATED
- CAP_ESP01
- CAP_LED_PLAIN
- CAP_DIPSWITCH
pico_socket: false
module_memory: false
pins:
  uart_tx: 0
  uart_rx: 1
  ps2_kb_clk: 2
  ps2_kb_dat: 3
  ps2_ms_clk: 0
  ps2_ms_dat: 1
  sd_dat0: 4
  sd_cs: 5
  sd_clk: 6
  sd_cmd: 7
  i2s_data: 9
  i2s_clk_base: 10
  video_base: 12
  psram_cs: 8
  led_plain: 25
  esp_uart_tx: 20
  esp_uart_rx: 21
  pad_latch: 21
  pad_clk: 20
  pad_d1: 26
  pad_d2: 27
  tape_in: 22
  dip: 22
video_default: auto
i2s_lr_swapped: false
signature_name: sig_minifrank
signature:
  2: high
  3: high
  8: high
  20: high
flash_bytes: 16777216
psram_bytes: 8388608
manual_note: 'S2: 1-4 closes tape onto GP22; 2 selects the audio mux. S1 selects the USB mux. J13 carries
  I2S off-board to a TurboSound daughtercard.'
signature_inline_notes:
- TXS0104 A-side, 10K
- PSRAM CE
- ESP-01S URXD idles high
