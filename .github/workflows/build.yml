# frank-sdk CI: generated board files current, MCP tests, every example on every board.
#
# The firmware and desktop builds run on rbx1 (runners rbx1-frank-sdk-1/2, labels
# frank-sdk + rp2350, user frank-ci without sudo), which keeps the Pico SDK 2.2.0 and a
# built picotool in /opt/frank-ci (PICO_SDK_PATH, picotool_DIR in the runners' .env).
# A self-hosted runner must never run code from a fork: those jobs run for pushes to
# this repository and for pull requests from its own branches only.
name: build
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml "mcp>=2.3" pyserial pytest && pip install -e mcp
      - run: python tools/gen_boards.py --check
      - run: pytest -q mcp/tests/test_frank.py
  examples:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, frank-sdk]
    strategy:
      fail-fast: false
      matrix:
        board: [M1, M2, NX, C2, SL, FZ, FN, Z0, PC, TW, AF]
        example: [hello, video, diag]
        exclude:
          - {board: SL, example: video}   # the slave has no HDMI
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S examples/${{ matrix.example }} -B b --fresh -G Ninja -DFRANK_BOARD=${{ matrix.board }} -DPICO_SDK_PATH=$PICO_SDK_PATH
      # warnings in frank-sdk's own sources fail the build; the SDK builds picotool
      # from source on the runner, and its host-compiler warnings are not ours
      - run: cmake --build b 2>&1 | tee build.log; ! grep "warning:" build.log | grep "$PWD/" | grep -v "$PWD/b/"
  variants:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, frank-sdk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: M2, example: video, opts: "-DFRANK_VIDEO_OUT=vga"}
          - {board: M2, example: video, opts: "-DFRANK_VIDEO_OUT=composite"}
          - {board: M2, example: video, opts: "-DFRANK_HDMI_BACKEND=pio"}
          - {board: M2, example: diag, opts: "-DFRANK_CONSOLE=uart"}
          - {board: NX, example: dual, opts: ""}
          - {board: SL, example: dual, opts: ""}
          - {board: C2, example: dual, opts: ""}
          - {board: GA, example: runtime, opts: ""}
          - {board: GB, example: runtime, opts: ""}
          - {board: XT, example: runtime, opts: ""}
          - {board: NX, example: runtime, opts: "-DFRANK_RUNTIME_BOARD=ON"}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S examples/${{ matrix.example }} -B b --fresh -G Ninja -DFRANK_BOARD=${{ matrix.board }} ${{ matrix.opts }} -DPICO_SDK_PATH=$PICO_SDK_PATH
      # warnings in frank-sdk's own sources fail the build; the SDK builds picotool
      # from source on the runner, and its host-compiler warnings are not ours
      - run: cmake --build b 2>&1 | tee build.log; ! grep "warning:" build.log | grep "$PWD/" | grep -v "$PWD/b/"
  host:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, frank-sdk]
    steps:
      - uses: actions/checkout@v4
      - run: for ex in hello video diag; do rm -rf b-$ex && cmake -S host -B b-$ex -DAPP_DIR=$PWD/examples/$ex && cmake --build b-$ex || exit 1; done
